name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'open-video-editor-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 34 SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Unpack Android project archive
        run: |
          test -f open-video-editor-project.zip
          mkdir -p project
          unzip -q open-video-editor-project.zip -d project
          test -f project/gradlew
          test -f project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --refresh-dependencies --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-video-editor-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
